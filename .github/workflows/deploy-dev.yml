name: Deploy Infrastructure - Dev

on:
  push:
    branches:
      - dev
    paths:
      - 'lib/**'
      - 'bin/**'
      - 'cdk.json'
      - 'package.json'
      - '.github/workflows/deploy-dev.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'lib/**'
      - 'bin/**'
      - 'cdk.json'
      - 'package.json'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - validate
          - bootstrap
          - deploy
          - diff

env:
  AWS_REGION: us-east-2
  NODE_VERSION: '20.x'
  ENVIRONMENT: dev

permissions:
  id-token: write # Necesario para OIDC
  contents: read

jobs:
  validate:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Necesario para OIDC
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_DEV }}:role/sotrux-auto-cdk-deploy-role-dev
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Validate

      - name: Run cdk-nag validation
        run: npm run cdk:nag -- --context env=${{ env.ENVIRONMENT }}
        continue-on-error: true
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID_DEV }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Synthesize CloudFormation templates
        run: npm run cdk:synth -- --context env=${{ env.ENVIRONMENT }}
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID_DEV }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdk-output
          path: cdk.out/
          retention-days: 7

  bootstrap:
    name: Bootstrap CDK
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'bootstrap'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Para bootstrap, usar un role de administrador temporal o credenciales
          # NOTA: Este role debe existir antes del primer despliegue
          # Alternativa: usar AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY como secrets temporales
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Bootstrap

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap CDK
        run: npx cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID_DEV }}/${{ env.AWS_REGION }}
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID_DEV }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: validate
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_DEV }}:role/sotrux-auto-cdk-deploy-role-dev
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Deploy-${{ github.sha }}

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy VPC Stack
        run: |
          npx cdk deploy --context env=${{ env.ENVIRONMENT }} SotruxAutoVpc-${{ env.ENVIRONMENT }} \
            --require-approval never \
            --concurrency 1
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID_DEV }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Deploy IAM Stack
        run: |
          npx cdk deploy --context env=${{ env.ENVIRONMENT }} \
            --context github-repository=${{ github.repository }} \
            --context github-branch=dev \
            SotruxAutoIam-${{ env.ENVIRONMENT }} \
            --require-approval never \
            --concurrency 1
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID_DEV }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          GITHUB_BRANCH: dev

      - name: Verify deployment
        run: |
          npx cdk diff --context env=${{ env.ENVIRONMENT }} || true
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID_DEV }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "- Region: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Stacks deployed:" >> $GITHUB_STEP_SUMMARY
          echo "  - SotruxAutoVpc-${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "  - SotruxAutoIam-${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY

  diff:
    name: Show Changes
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'diff')
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_DEV }}:role/sotrux-auto-cdk-deploy-role-dev
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Diff-${{ github.sha }}

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Show changes
        run: |
          npx cdk diff --context env=${{ env.ENVIRONMENT }}
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID_DEV }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

